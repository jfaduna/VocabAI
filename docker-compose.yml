services:
  db:
    image: postgres:17
    container_name: vocabai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocabai
      POSTGRES_PASSWORD: vocabai_dev_password
      POSTGRES_DB: vocabai
    ports:
      - "5433:5432"
    volumes:
      - vocabai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vocabai -d vocabai" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vocabai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vocabai-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vocabai_postgres_data:
